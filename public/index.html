<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Krillion GD</title><link rel="stylesheet" href="style.css"></head><body><div class="bg"></div><main><header><h1>KRILLION <span>GD</span></h1><p class="sub">A rarity dive. Now with Geometry Dash vibes.</p></header><section id="home" class="panel"><h2>Solo dive</h2><div class="row"><select id="category"><option value="">All categories</option></select><button id="solo">Start dive</button></div><hr><h2>Multiplayer</h2><div class="row"><input id="name" placeholder="Your name" maxlength="24"><select id="mode"><option value="versus">Versus</option><option value="coop">Co-op</option></select><input id="code" placeholder="Room code (optional)"><button id="join">Join / create</button></div><p class="hint">Create a room with an empty code, or join one using a code.</p><hr><button class="secondary" id="adminLink">Admin panel</button></section><section id="game" class="panel hidden"><div class="row space"><span id="round"></span><span id="score">Score: 0</span></div><p id="categoryName" class="category"></p><h2 id="prompt"></h2><div class="row"><input id="answer" placeholder="Your answer" autocomplete="off"><button id="submit">Submit</button></div><p id="feedback"></p><div id="multiplayer"></div><button class="secondary" id="back">Back</button></section><section id="admin" class="panel hidden"><h2>Global question admin</h2><div id="login"><input type="password" id="password" placeholder="Admin password"><button id="loginBtn">Login</button></div><div id="editor" class="hidden"><h3>Add category</h3><div class="row"><input id="newCategory" placeholder="Category name"><button id="addCategory">Add</button></div><h3>Add question</h3><input id="promptInput" placeholder="Prompt"><select id="catInput"></select><h4>Answers (one per line: answer | tier)</h4><textarea id="answersInput" placeholder="Stereo Madness | plankton&#10;Nine Circles | rare&#10;..." rows="6"></textarea><button id="saveQuestion">Save question</button><p id="adminMsg"></p><h3>Existing questions</h3><div id="list"></div></div><button class="secondary" id="adminBack">Back</button></section></main><script src="app.js"></script></body></html>
