services:
  - type: web
    name: krillion-gd
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: krillion-gd-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
databases:
  - name: krillion-gd-db
    plan: free
    databaseName: krillion_gd
    user: krillion_gd
